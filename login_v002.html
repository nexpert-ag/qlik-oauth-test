<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Host</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { 
      height: 100%; 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; 
    }
    .wrap { 
      height: 100%; 
      display: flex; 
      flex-direction: column; 
    }
    .bar { 
      padding: 10px 14px; 
      font-size: 14px; 
      color: #333; 
      background: #f5f5f5; 
      border-bottom: 1px solid #e3e3e3;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .frame { 
      flex: 1; 
      border: none; 
      width: 100%; 
      min-height: 0;
    }
    .login-overlay { 
      position: fixed; 
      top: 0; 
      left: 0; 
      right: 0; 
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; 
      align-items: center; 
      justify-content: center;
      z-index: 9999;
    }
    .login-box {
      text-align: center; 
      padding: 50px 40px;
      background: white; 
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 400px;
    }
    .login-box h2 {
      margin: 0 0 10px 0;
      color: #333;
      font-size: 28px;
    }
    .login-box p {
      color: #666;
      margin: 0 0 30px 0;
      font-size: 15px;
    }
    .btn-primary { 
      cursor: pointer; 
      padding: 14px 32px; 
      font-size: 16px;
      font-weight: 500;
      background: #667eea; 
      color: white; 
      border: none;
      border-radius: 6px; 
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    .btn-primary:hover { 
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary {
      cursor: pointer;
      padding: 8px 16px;
      font-size: 14px;
      background: white;
      color: #667eea;
      border: 1px solid #667eea;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: #f0f2ff;
    }
    .status-message {
      text-align: center;
      padding: 12px;
      margin: 20px;
      border-radius: 6px;
      display: none;
    }
    .status-error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }
    .status-success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
    }
  </style>
</head>
<body>
  <!-- Status Messages -->
  <div id="status-message" class="status-message"></div>

  <!-- Login Overlay -->
  <div id="login-overlay" class="login-overlay" style="display:none;">
    <div class="login-box">
      <h2>🎯 Qlik Dashboard</h2>
      <p>Melden Sie sich mit Ihrem Qlik-Account an,<br>um das Dashboard anzuzeigen.</p>
      <button class="btn-primary" onclick="loginToQlik()">
        🔐 Bei Qlik anmelden
      </button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard-wrap" class="wrap" style="display:none;">
    <div class="bar">
      <div>
        <strong>Dashboard</strong>
        <span style="opacity:.6; margin-left: 8px;">– Live Analytics</span>
      </div>
      <button class="btn-secondary" onclick="logout()">
        Abmelden
      </button>
    </div>
    <iframe
      id="dashboard-frame"
      class="frame"
      src="https://nexpert-ag.github.io/qlik-oauth-test/POC_V002.html"
      allowfullscreen
    ></iframe>
  </div>

  <!-- Qlik Embed Web Components (handhabt OAuth automatisch) -->
  <script
    crossorigin="anonymous"
    type="application/javascript"
    src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js"
    data-host="https://nexpertag.eu.qlikcloud.com"
    data-client-id="019be184467ca77832148e24b21c23ac"
    data-redirect-uri="https://nexpert-ag.github.io/qlik-oauth-test/oauth_callback.html"
    data-auto-redirect="false"
    data-access-token-storage="session"
  ></script>

  <script>
    (function () {
      // ========== TOKEN MANAGEMENT ==========
      function hasValidToken() {
        const token = sessionStorage.getItem("qlik.accessToken");
        if (!token) return false;
        
        // Token-Ablauf prüfen (optional)
        const expiry = sessionStorage.getItem("qlik.accessToken.expiry");
        if (expiry && Date.now() > parseInt(expiry)) {
          console.log("Token abgelaufen");
          sessionStorage.removeItem("qlik.accessToken");
          sessionStorage.removeItem("qlik.accessToken.expiry");
          return false;
        }
        return true;
      }

      // ========== POPUP OAUTH FLOW ==========
      async function startOAuthPopup() {
        try {
          console.log("Starte OAuth Login...");
          
          // Nutze Qlik's eigenen Auth-Handler
          const auth = window.qlikEmbed?.auth;
          
          if (!auth) {
            throw new Error("Qlik Embed Library nicht geladen");
          }

          // Öffne Login in einem Popup
          await auth.login({
            autoRedirect: false,
            onlyPopup: true
          });

          console.log("Login erfolgreich!");
          showStatus("Anmeldung erfolgreich!", "success");
          setTimeout(() => location.reload(), 1000);
          
        } catch (error) {
          console.error("Login fehlgeschlagen:", error);
          showStatus("Login fehlgeschlagen: " + error.message, "error");
        }
      }

      // ========== STATUS MESSAGES ==========
      function showStatus(message, type) {
        const statusDiv = document.getElementById('status-message');
        if (statusDiv) {
          statusDiv.textContent = message;
          statusDiv.className = 'status-message status-' + type;
          statusDiv.style.display = 'block';
          
          if (type === 'success') {
            setTimeout(() => {
              statusDiv.style.display = 'none';
            }, 3000);
          }
        }
      }

      // ========== LOGOUT ==========
      window.logout = async function() {
        try {
          const auth = window.qlikEmbed?.auth;
          if (auth) {
            await auth.logout();
          }
        } catch (e) {
          console.error("Logout Fehler:", e);
        }
        
        sessionStorage.clear();
        console.log("Ausgeloggt");
        location.reload();
      };

      // ========== INITIALISIERUNG ==========
      function checkAuthAndInit() {
        console.log("Seite geladen, prüfe Token...");
        
        const overlay = document.getElementById('login-overlay');
        const dashboardWrap = document.getElementById('dashboard-wrap');
        
        if (!hasValidToken()) {
          console.log("Kein gültiges Token → Zeige Login");
          overlay.style.display = 'flex';
          dashboardWrap.style.display = 'none';
        } else {
          console.log("Token vorhanden → Zeige Dashboard");
          overlay.style.display = 'none';
          dashboardWrap.style.display = 'flex';
        }
      }

      // Warte bis Qlik Embed Library geladen ist
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          setTimeout(checkAuthAndInit, 500);
        });
      } else {
        setTimeout(checkAuthAndInit, 500);
      }

      // Mache Login-Funktion global verfügbar
      window.loginToQlik = startOAuthPopup;
      
    })();
  </script>
</body>
</html>
